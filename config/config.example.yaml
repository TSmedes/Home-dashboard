# ---------------------------------------------------------------------------
# Home dashboard configuration.
#
# This file is the source of truth for layout and preferences. It is safe to
# edit by hand; the settings screen (the gear, top left) edits only the values
# you change and leaves the rest of this file exactly as written - comments
# and their alignment included.
# Changes are picked up live - no restart, no rebuild.
#
# The layout below can also be arranged from the dashboard itself, under
# Settings -> Widgets -> Edit layout: moving, resizing, adding and removing
# widgets, pages and screens. It writes back here, so the two are the same
# thing seen from either end.
#
# Secrets do NOT belong here. API keys, OAuth credentials and the calendar's
# secret iCal addresses go in .env.
# ---------------------------------------------------------------------------

location:
  name: "Snoqualmie, WA"
  lat: 47.5287
  lon: -121.8254
  timezone: "America/Los_Angeles" # drives the clock and the day/night switch

units:
  temperature: fahrenheit # fahrenheit | celsius
  wind: mph               # mph | kmh | ms | kn
  clock: 12h              # 12h | 24h

server:
  port: 8080

# How often each source is polled, in seconds.
refresh:
  weather: 900  # 15 minutes
  calendar: 300 # 5 minutes
  tasks: 120
  lights: 30
  river: 900       # NOAA updates gauges every 15 minutes or so
  countdowns: 3600
  commute: 600     # TomTom's free tier allows 2,500 requests a day in total
  spotify: 10
  system: 10       # CPU, memory, temperatures, disks, network
  services: 30     # Docker containers and URL checks

# Which calendars appear is set by the secret iCal addresses in .env
# (CALENDAR_ICAL_URLS), not here - each address is a credential.
calendar:
  daysAhead: 62

# Tasks are read from, and quick-added to, this TickTick list. Who each task is
# assigned to comes from the list's members in TickTick; nothing to fill in.
ticktick:
  listName: "🏡To-Do"

# Kasa bulbs. Reserve a static IP for each in your router: container networking
# cannot use Kasa's broadcast discovery, so the address must be written down.
# Add hidden: true to keep a bulb off the dashboard (settings does this for you).
lights: []
# lights:
#   - { id: living, name: "Living Room", host: 192.168.1.50 }
#   - { id: bedroom, name: "Bedroom", host: 192.168.1.51 }

# Bin collections for the bin-day widget. `day` is sun..sat. For a bin
# collected every other week, set `every: 2` and give any date it was (or will
# be) collected as `anchor`. Holiday shifts go in `moved`; cancelled pickups in
# `skip`. The evening before a pickup, the widget says to put the bin out.
# The tile itself only appears the day before a collection and the day of it.
bins: []
# bins:
#   - { name: Trash, day: tue }
#   - { name: Recycling, day: tue, every: 2, anchor: "2026-09-29" }
#   - name: Yard waste
#     day: tue
#     every: 2
#     anchor: "2026-09-22"
#     moved: [{ from: "2026-12-29", to: "2026-12-30" }]
#     skip: ["2026-12-22"]

# Countdowns: dates listed here, plus any calendar event with the tag in its
# title (the tag is dropped from what is shown). A yearly event counts down to
# its next occurrence only.
countdowns:
  calendarTag: "#countdown"
  daysAhead: 365
  items: []
  # items:
  #   - { name: "Halloween", date: "2026-10-31", emoji: "🎃" }

# River gauges from NOAA's National Water Prediction Service; no key needed.
# Ids are the NWS location ids on water.noaa.gov. These are the gauges a river
# widget shows unless it lists its own in options.gauges. Nearby:
#   SQUW1  Snoqualmie River at Snoqualmie Falls (has flood thresholds)
#   SNQW1  North Fork Snoqualmie near Snoqualmie Falls
#   TANW1  Middle Fork Snoqualmie near Tanner
#   GARW1  South Fork Snoqualmie near Garcia
#   CRNW1  Snoqualmie River near Carnation
river:
  gauges: [SQUW1]

# Drive times from `location` with live traffic, via TomTom. Needs
# TOMTOM_API_KEY in .env. Up to five destinations; right-click a place in any
# map to copy its latitude and longitude.
commute:
  destinations: []
  # destinations:
  #   - { id: office, name: "Office", lat: 47.6101, lon: -122.2015 }

# The machine the dashboard runs on (Linux only). In Docker, docker-compose.yml
# mounts the host read-only so these are the host's numbers, not the
# container's - see "Homelab monitoring" in the README. Disk paths are mount
# points as the host sees them. `interface` defaults to the one with the
# default route; `name` defaults to the host's own name.
system:
  disks:
    - { path: /, name: "System" }
    # - { path: /mnt/media, name: "Media" }
  tempWarn: 75 # °C
  tempCrit: 90
  # interface: eth0
  # name: "homelab"

# Service status. Docker containers are listed from the Docker socket (mounted
# in docker-compose.yml); include/exclude pick by container name. Checks are
# URLs that should answer - any 2xx/3xx is up unless expectStatus is given.
services:
  docker:
    enabled: true
    include: []
    exclude: []
  checks: []
  # checks:
  #   - { id: jellyfin, name: "Jellyfin", url: "http://10.0.0.78:8096/health" }
  #   - { id: router, name: "Router", url: "http://10.0.0.1" }

# ---------------------------------------------------------------------------
# Profiles. Each is an independent dashboard - its own widgets, layout and
# theme - and the schedule decides which one is showing. A window whose start
# is later than its end wraps past midnight.
#
# Layout is a 12-column grid. `col` and `row` are 1-based; spans default to 1.
# `enabled: false` switches a widget off and leaves its space empty.
#
# `stack: <name>` on two or more widgets makes them share one column: whichever
# are showing split the combined rectangle top to bottom, so one leaving never
# leaves a hole. Worth it next to a widget that comes and goes on its own -
# bin day is only on the wall either side of a collection, and whatever it is
# stacked with takes the column the rest of the week. (`share: true` is the
# same idea for a full-width row; see the night profile below.)
#
# Pages: give a widget `page: 2` (or 3...) to put it on another page. Pages sit
# side by side and change with a swipe; each page has its own grid. After
# `returnToFirstPage` seconds without a touch the screen slides back to page 1
# (0 = never). Widgets without `page` are on page 1.
# ---------------------------------------------------------------------------
profiles:
  # The daytime dashboard: everything on screen.
  day:
    schedule: { from: "06:30", to: "21:30" }
    theme: light
    returnToFirstPage: 120
    widgets:
      - id: clock
        type: clock
        grid: { col: 1, row: 1, colSpan: 4, rowSpan: 2 }

      - id: weather
        type: weather
        grid: { col: 5, row: 1, colSpan: 8, rowSpan: 2 }

      # days is how many days are listed one by one. Anything further off goes
      # under "Later" as a dated list, filling whatever room is left on the
      # card - so a taller tile shows more without being told to.
      - id: agenda
        type: calendar
        grid: { col: 1, row: 3, colSpan: 5, rowSpan: 4 }
        options: { days: 3 }

      # Ticking a task gives four seconds to undo before TickTick hears about
      # it. For a "my tasks" view, add: options: { assignee: you@example.com }
      # (a TickTick username). readOnly: true hides the add-a-task control.
      - id: todo
        type: tasks
        title: "🏡 To-Do"
        grid: { col: 6, row: 3, colSpan: 4, rowSpan: 4 }

      # Sharing the right-hand column with bin day on page 2 would look like
      # `stack: right-column` on both; here lights has the column to itself.
      - id: lights
        type: lights
        title: "Lights"
        grid: { col: 10, row: 3, colSpan: 3, rowSpan: 4 }

      # --- Page 2: swipe left ------------------------------------------------
      # One gauge gets a big reading and chart; several get a row each.
      # e.g. options: { gauges: [SNQW1, TANW1, GARW1] } for the three forks.
      - id: river
        type: river
        title: "Snoqualmie River"
        page: 2
        grid: { col: 1, row: 1, colSpan: 5, rowSpan: 3 }

      # Worked out from `location`; no service needed.
      - id: sunmoon
        type: sunmoon
        title: "Sun & moon"
        page: 2
        grid: { col: 6, row: 1, colSpan: 4, rowSpan: 3 }

      # Only on the wall the day before a collection and the day itself. Give
      # it a `stack:` name shared with the widget above or below it and that
      # one takes the space the rest of the week.
      - id: bins
        type: bins
        title: "Bin day"
        page: 2
        grid: { col: 10, row: 1, colSpan: 3, rowSpan: 3 }

      # The tile shows the next one only, big enough to read across a room;
      # tapping it lists them all. options: { limit: 3 } shows more.
      - id: countdowns
        type: countdowns
        title: "Countdowns"
        page: 2
        grid: { col: 1, row: 4, colSpan: 4, rowSpan: 3 }

      - id: commute
        type: commute
        title: "Drive times"
        page: 2
        grid: { col: 5, row: 4, colSpan: 4, rowSpan: 3 }

      # Needs SPOTIFY_CLIENT_ID in .env, then Connect Spotify in Settings.
      - id: spotify
        type: spotify
        title: "Now playing"
        page: 2
        grid: { col: 9, row: 4, colSpan: 4, rowSpan: 3 }

      # --- Page 3: the homelab ----------------------------------------------
      # All four stats widgets share one reading of the host; see system: above.
      - id: cpu
        type: cpu
        title: "CPU & memory"
        page: 3
        grid: { col: 1, row: 1, colSpan: 4, rowSpan: 3 }

      - id: temps
        type: temps
        title: "Temperatures"
        page: 3
        grid: { col: 5, row: 1, colSpan: 4, rowSpan: 3 }

      - id: network
        type: network
        title: "Network"
        page: 3
        grid: { col: 9, row: 1, colSpan: 4, rowSpan: 3 }

      - id: disks
        type: disks
        title: "Disks"
        page: 3
        grid: { col: 1, row: 4, colSpan: 5, rowSpan: 3 }

      # Problems are listed first, so the top of the tile is what needs a look.
      - id: services
        type: services
        title: "Services"
        page: 3
        grid: { col: 6, row: 4, colSpan: 7, rowSpan: 3 }

  # The night dashboard: a big clock you can read from across a dark room.
  night:
    schedule: { from: "21:30", to: "06:30" }
    theme: dark
    widgets:
      - id: clock
        type: clock
        grid: { col: 1, row: 1, colSpan: 12, rowSpan: 4 }
        options: { size: xl, showSeconds: false }

      # The bottom row is shared: whichever of these are switched on split it
      # evenly, so turning one on or off in settings never leaves a gap.
      - id: weather
        type: weather
        grid: { row: 5, rowSpan: 2, share: true }
        options: { compact: true }

      # Two days, so it reads correctly either side of midnight: late in the
      # evening it shows the rest of today and tomorrow; after midnight "today"
      # has already become the new day.
      - id: agenda
        type: calendar
        grid: { row: 5, rowSpan: 2, share: true }
        options: { days: 2 }

      - id: todo
        type: tasks
        title: "🏡 To-Do"
        enabled: false
        grid: { row: 5, rowSpan: 2, share: true }

      - id: lights
        type: lights
        title: "Lights"
        enabled: false
        grid: { row: 5, rowSpan: 2, share: true }
